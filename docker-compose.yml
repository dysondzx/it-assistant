services:
  backend:
    build: ./backend
    container_name: rag-backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - SQLITE_PATH=/data/it_ops.db
      - FAISS_INDEX_PATH=/data/faiss_it_manual
      - KG_PATH=/data/it_ops_kg.pkl
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-rag-prod}
    volumes:
      # 持久化数据目录
      - rag-data:/data
    networks:
      - rag-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:                        # 仅 prod profile 启动时才起
    image: nginx:alpine
    # profiles: ["prod"]
    container_name: rag-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      # - "443:443"             # SSL 时取消注释
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      # - ./certbot/conf:/etc/nginx/ssl:ro   # SSL 证书
    networks:
      - rag-net

volumes:
  rag-data:
    driver: local

networks:
  rag-net:
    driver: bridge